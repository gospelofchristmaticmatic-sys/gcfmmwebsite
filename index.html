<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCFMM WEBSITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #90e0ef, #a0c4ff, #caf0f8);
            background-size: 200% 200%;
            animation: bgShift 10s ease infinite;
            min-height: 100vh;
            color: #333;
            margin: 0;
            padding: 32px 16px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- BACKGROUND & CLICK PARTICLE CANVASES --- */
        #bgParticles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #clickParticles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            pointer-events: none;
        }

        /* --- 0-100% LOADING SCREEN --- */
        .loader-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #034078, #0077b6);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader-screen.done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        body.skip-loader .loader-screen {
            display: none !important;
        }

        .loader-cross {
            font-size: 2.8rem;
            margin-bottom: 8px;
            animation: pulseCross 1.6s ease-in-out infinite;
        }

        .loader-church {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .loader-sub {
            font-size: 0.95rem;
            color: #caf0f8;
            margin: 0 0 24px;
        }

        .loader-percent {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #90e0ef;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .loader-bar-track {
            width: 260px;
            max-width: 85vw;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #90e0ef, #ffffff);
            border-radius: 999px;
        }

        /* --- MAIN PAGE CONTAINER & CARDS --- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
        }

        section {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 22px 26px;
            margin: 20px auto;
            box-shadow: 0 8px 20px rgba(3, 64, 120, 0.14);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.25s ease;
        }

        body.loaded section {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded section:nth-child(1) { transition-delay: 0.08s; }
        body.loaded section:nth-child(2) { transition-delay: 0.16s; }
        body.loaded section:nth-child(3) { transition-delay: 0.24s; }

        body.loaded section:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 26px rgba(3, 64, 120, 0.2);
        }

        h1 {
            color: #034078;
            margin: 0 0 8px;
            font-size: 2rem;
        }

        h2 {
            color: #034078;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.35rem;
            display: inline-block;
            border-bottom: 2px solid #90e0ef;
            padding-bottom: 4px;
        }

        p {
            margin: 6px 0 12px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 12px 0 0;
        }

        ul li {
            margin: 12px 0;
        }

        a.btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #034078, #1d4ed8);
            color: #ffffff;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a.btn-link:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 18px rgba(29, 78, 216, 0.45);
        }

        iframe {
            margin-top: 12px;
            border: 2px solid #034078;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            height: 360px;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseCross {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
    </style>
</head>
<body>
    <!-- Check immediately if returning from about.html or already loaded this session -->
    <script>
        (function () {
            const shouldSkip =
                sessionStorage.getItem("gcfmm_skip_loader") === "1" ||
                sessionStorage.getItem("gcfmm_loaded_once") === "1";
            if (shouldSkip) {
                sessionStorage.removeItem("gcfmm_skip_loader");
                document.body.classList.add("skip-loader", "loaded");
            }
        })();
    </script>

    <!-- Background Moving Circles -->
    <canvas id="bgParticles"></canvas>

    <!-- Link Click Popping Circles -->
    <canvas id="clickParticles"></canvas>

    <!-- 0% to 100% Opening Loader (2.5 seconds) -->
    <div class="loader-screen" id="loaderScreen">
        <div class="loader-cross">✝</div>
        <p class="loader-church">Gospel of Christ Fellowship</p>
        <p class="loader-sub">Maticmatic, Sta. Barbara, Pangasinan</p>
        <div class="loader-percent" id="loaderPercent">0%</div>
        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
    </div>

    <!-- Main Website Content -->
    <div class="container">
        <section>
            <h1>Welcome to GCFMM WEBSITE</h1>
            <p>You are all welcome to our church</p>
        </section>

        <section>
            <h2>Links &amp; Info</h2>
            <ul>
                <li>
                    <a class="btn-link" href="about.html">
                        About Us &amp; Sunday Services
                    </a>
                </li>
                <li>
                    <a class="btn-link" href="https://www.facebook.com/gcfmm2023" target="_blank" rel="noopener noreferrer">
                        Visit Our Facebook Page
                    </a>
                </li>
            </ul>
        </section>

        <section>
            <h2>Location</h2>
            <p>We are located in Maticmatic, Sta. Barbara, Pangasinan</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d122777.35520395542!2d120.36112730116957!3d15.919945908670009!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x339141f596049c1b%3A0xca8bba65d439f027!2sGospel%20of%20Christ%20Fellowship%20Maticmatic!5e0!3m2!1sen!2sph!4v1795173584442!5m2!1sen!2sph"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                title="Gospel of Christ Fellowship Maticmatic Location"
            ></iframe>
        </section>
    </div>

    <script>
        // --- 1. 2.5-SECOND 0-100% LOADER (SKIPS WHEN RETURNING) ---
        function startLoader() {
            if (document.body.classList.contains("skip-loader")) {
                document.body.classList.add("loaded");
                return;
            }

            const percentEl = document.getElementById("loaderPercent");
            const barFillEl = document.getElementById("loaderBarFill");
            const loaderScreen = document.getElementById("loaderScreen");

            if (!percentEl || !barFillEl || !loaderScreen) return;

            const duration = 2500;
            const startTime = performance.now();

            function finishLoader() {
                sessionStorage.setItem("gcfmm_loaded_once", "1");
                percentEl.textContent = "100%";
                barFillEl.style.width = "100%";
                setTimeout(function () {
                    loaderScreen.classList.add("done");
                    document.body.classList.add("loaded");
                }, 250);
            }

            function updateProgress(now) {
                const elapsed = now - startTime;
                const progress = Math.min(100, Math.floor((elapsed / duration) * 100));

                percentEl.textContent = progress + "%";
                barFillEl.style.width = progress + "%";

                if (elapsed < duration) {
                    requestAnimationFrame(updateProgress);
                } else {
                    finishLoader();
                }
            }

            requestAnimationFrame(updateProgress);
            setTimeout(finishLoader, duration + 1000);
        }

        // --- 2. BACKGROUND MOVING SMALL CIRCLES ---
        function initBackgroundParticles() {
            const canvas = document.getElementById("bgParticles");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const colors = [
                "rgba(3, 64, 120, 0.16)",
                "rgba(29, 78, 216, 0.14)",
                "rgba(255, 255, 255, 0.45)",
                "rgba(0, 119, 182, 0.16)"
            ];

            const count = Math.min(45, Math.floor((window.innerWidth * window.innerHeight) / 22000));
            const circles = Array.from({ length: Math.max(18, count) }, function () {
                return {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 3 + Math.random() * 6,
                    vx: (Math.random() - 0.5) * 0.7,
                    vy: (Math.random() - 0.5) * 0.7,
                    color: colors[Math.floor(Math.random() * colors.length)]
                };
            });

            function drawBg() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < circles.length; i++) {
                    const c = circles[i];
                    c.x += c.vx;
                    c.y += c.vy;

                    if (c.x < -c.r) c.x = canvas.width + c.r;
                    if (c.x > canvas.width + c.r) c.x = -c.r;
                    if (c.y < -c.r) c.y = canvas.height + c.r;
                    if (c.y > canvas.height + c.r) c.y = -c.r;

                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fillStyle = c.color;
                    ctx.fill();
                }

                requestAnimationFrame(drawBg);
            }

            requestAnimationFrame(drawBg);
        }

        // --- 3. LINK CLICK POPPING CIRCLE PARTICLES ---
        function initClickParticles() {
            const canvas = document.getElementById("clickParticles");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const burstColors = ["#034078", "#1d4ed8", "#0077b6", "#90e0ef", "#ffffff"];
            const pops = [];

            function spawnPop(x, y) {
                const count = 18;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
                    const speed = 2.2 + Math.random() * 4.2;
                    pops.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        r: 3 + Math.random() * 4.5,
                        alpha: 1,
                        color: burstColors[Math.floor(Math.random() * burstColors.length)]
                    });
                }
            }

            function drawPops() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = pops.length - 1; i >= 0; i--) {
                    const p = pops[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.96;
                    p.vy *= 0.96;
                    p.r *= 0.96;
                    p.alpha -= 0.03;

                    if (p.alpha <= 0.02 || p.r < 0.5) {
                        pops.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }

                requestAnimationFrame(drawPops);
            }

            requestAnimationFrame(drawPops);

            document.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function (e) {
                    const x = e.clientX || link.getBoundingClientRect().left + link.offsetWidth / 2;
                    const y = e.clientY || link.getBoundingClientRect().top + link.offsetHeight / 2;
                    spawnPop(x, y);

                    const href = link.getAttribute("href");
                    const opensNewTab = link.getAttribute("target") === "_blank";
                    const isSameTabPage = href && !href.startsWith("#") && !opensNewTab;

                    if (isSameTabPage) {
                        e.preventDefault();
                        setTimeout(function () {
                            window.location.href = href;
                        }, 260);
                    }
                });
            });
        }

        function initAll() {
            startLoader();
            initBackgroundParticles();
            initClickParticles();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initAll);
        } else {
            initAll();
        }
    </script>
</body>
</html>
