<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCFMM WEBSITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.55), transparent 35%),
                radial-gradient(circle at 85% 25%, rgba(0, 119, 182, 0.18), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(29, 78, 216, 0.14), transparent 45%),
                linear-gradient(135deg, #72efdd 0%, #90e0ef 35%, #a0c4ff 70%, #caf0f8 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 220% 220%;
            animation: bgShift 12s ease infinite;
            min-height: 100vh;
            color: #1e293b;
            margin: 0;
            padding: 36px 16px;
            line-height: 1.65;
            overflow-x: hidden;
        }

        /* --- BACKGROUND & CLICK PARTICLE CANVASES --- */
        #bgParticles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #clickParticles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            pointer-events: none;
        }

        /* --- 0-100% LOADING SCREEN --- */
        .loader-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 35%, rgba(144, 224, 239, 0.22), transparent 55%),
                linear-gradient(135deg, #022b52, #034078 55%, #0077b6);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader-screen.done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-cross {
            font-size: 2.8rem;
            margin-bottom: 8px;
            animation: pulseCross 1.6s ease-in-out infinite;
        }

        .loader-church {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .loader-sub {
            font-size: 0.95rem;
            color: #caf0f8;
            margin: 0 0 24px;
        }

        .loader-percent {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #90e0ef;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .loader-bar-track {
            width: 260px;
            max-width: 85vw;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #90e0ef, #ffffff);
            border-radius: 999px;
        }

        /* --- MAIN PAGE CONTAINER & STYLED TEXT CARDS --- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
        }

        section {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at top right, rgba(144, 224, 239, 0.26), transparent 45%),
                linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(240, 249, 255, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-top: 4px solid #034078;
            border-radius: 16px;
            padding: 24px 28px;
            margin: 22px auto;
            box-shadow:
                0 10px 24px rgba(3, 64, 120, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.25s ease;
        }

        body.loaded section {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded section:nth-child(1) { transition-delay: 0.08s; border-top-color: #034078; }
        body.loaded section:nth-child(2) { transition-delay: 0.16s; border-top-color: #0077b6; }
        body.loaded section:nth-child(3) { transition-delay: 0.24s; border-top-color: #1d4ed8; }

        body.loaded section:hover {
            transform: translateY(-4px);
            box-shadow:
                0 14px 30px rgba(3, 64, 120, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        h1 {
            color: #034078;
            margin: 0 0 8px;
            font-size: 2rem;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        h2 {
            color: #034078;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.35rem;
            display: inline-block;
            background: linear-gradient(90deg, rgba(144, 224, 239, 0.45), rgba(160, 196, 255, 0.35));
            border-bottom: 2px solid #0077b6;
            border-radius: 8px 8px 0 0;
            padding: 4px 12px;
        }

        p {
            margin: 6px 0 12px;
            color: #1e293b;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 14px 0 0;
        }

        ul li {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.75), rgba(240, 249, 255, 0.55));
            border: 1px solid rgba(3, 64, 120, 0.1);
        }

        a.btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #034078, #0077b6 55%, #1d4ed8);
            color: #ffffff;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(3, 64, 120, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a.btn-link:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.45);
        }

        iframe {
            margin-top: 12px;
            border: 2px solid #034078;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            height: 360px;
        }

        @keyframes bgShift {
            0% { background-position: 0% 0%, 100% 0%, 50% 100%, 0% 50%; }
            50% { background-position: 0% 0%, 100% 0%, 50% 100%, 100% 50%; }
            100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0% 50%; }
        }

        @keyframes pulseCross {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
    </style>
</head>
