<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCFMM WEBSITE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #90e0ef, #a0c4ff, #caf0f8);
            background-size: 200% 200%;
            animation: bgShift 10s ease infinite;
            min-height: 100vh;
            color: #333;
            margin: 0;
            padding: 32px 16px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 0-100% LOADING SCREEN --- */
        .loader-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #034078, #0077b6);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 24px;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .loader-screen.done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-cross {
            font-size: 2.8rem;
            margin-bottom: 8px;
            animation: pulseCross 1.6s ease-in-out infinite;
        }

        .loader-church {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 4px;
        }

        .loader-sub {
            font-size: 0.95rem;
            color: #caf0f8;
            margin: 0 0 24px;
        }

        .loader-percent {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #90e0ef;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .loader-bar-track {
            width: 260px;
            max-width: 85vw;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #90e0ef, #ffffff);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        /* --- MAIN PAGE CONTAINER & CARDS --- */
        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        section {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 22px 26px;
            margin: 20px auto;
            box-shadow: 0 8px 20px rgba(3, 64, 120, 0.14);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.25s ease;
        }

        body.loaded section {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded section:nth-child(1) { transition-delay: 0.1s; }
        body.loaded section:nth-child(2) { transition-delay: 0.22s; }
        body.loaded section:nth-child(3) { transition-delay: 0.34s; }

        body.loaded section:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 26px rgba(3, 64, 120, 0.2);
        }

        h1 {
            color: #034078;
            margin: 0 0 8px;
            font-size: 2rem;
        }

        h2 {
            color: #034078;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.35rem;
            display: inline-block;
            border-bottom: 2px solid #90e0ef;
            padding-bottom: 4px;
        }

        p {
            margin: 6px 0 12px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 12px 0 0;
        }

        ul li {
            margin: 12px 0;
        }

        a.btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #034078, #1d4ed8);
            color: #ffffff;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a.btn-link:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 18px rgba(29, 78, 216, 0.45);
        }

        iframe {
            margin-top: 12px;
            border: 2px solid #034078;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            height: 360px;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseCross {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
    </style>
</head>
<body>
    <!-- 0% to 100% Opening Loader (12 seconds) -->
    <div class="loader-screen" id="loaderScreen">
        <div class="loader-cross">✝</div>
        <p class="loader-church">Gospel of Christ Fellowship</p>
        <p class="loader-sub">Maticmatic, Sta. Barbara, Pangasinan</p>
        <div class="loader-percent" id="loaderPercent">0%</div>
        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
    </div>

    <!-- Main Website Content -->
    <div class="container">
        <section>
            <h1>Welcome to GCFMM WEBSITE</h1>
            <p>You are all welcome to our church</p>
        </section>

        <section>
            <h2>Links &amp; Info</h2>
            <ul>
                <li>
                    <a class="btn-link" href="about.html">
                        About Us &amp; Sunday Services
                    </a>
                </li>
                <li>
                    <a class="btn-link" href="https://www.facebook.com/gcfmm2023" target="_blank" rel="noopener noreferrer">
                        Visit Our Facebook Page
                    </a>
                </li>
            </ul>
        </section>

        <section>
            <h2>Location</h2>
            <p>We are located in Maticmatic, Sta. Barbara, Pangasinan</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d122777.35520395542!2d120.36112730116957!3d15.919945908670009!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x339141f596049c1b%3A0xca8bba65d439f027!2sGospel%20of%20Christ%20Fellowship%20Maticmatic!5e0!3m2!1sen!2sph!4v1795173584442!5m2!1sen!2sph"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                title="Gospel of Christ Fellowship Maticmatic Location"
            ></iframe>
        </section>
    </div>

    <script>
        (function () {
            const percentEl = document.getElementById("loaderPercent");
            const barFillEl = document.getElementById("loaderBarFill");
            const loaderScreen = document.getElementById("loaderScreen");

            let progress = 0;
            const interval = setInterval(() => {
                progress += 1;
                if (progress > 100) {
                    progress = 100;
                }

                percentEl.textContent = progress + "%";
                barFillEl.style.width = progress + "%";

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loaderScreen.classList.add("done");
                        document.body.classList.add("loaded");
                    }, 400);
                }
            }, 120); // 100 steps * 120ms = 12 seconds total
        })();
    </script>
</body>
</html>
